LABEL ROCKNIX
  LINUX /KERNEL
  ## Default DTB: R36 Ultra. Other consoles: run aplicar-dtb / dtbselect from the FAT root, or edit this line.
  ## FDT: leading slash required, nothing after .dtb (not even whitespace)
  FDT /rk3326-gameconsole-r36ultra.dtb
  APPEND boot=${partition_boot} disk=${partition_storage} @EXTRA_CMDLINE@ uboot.hwid_adc=${hwid_adc}
