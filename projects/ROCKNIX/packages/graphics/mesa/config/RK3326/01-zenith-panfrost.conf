<?xml version="1.0" standalone="yes"?>
<!--
Zenith (RK3326): per-program settings for Panfrost, measured on the Mali-G31.
libmali does not read drirc files, so this only matters when Panfrost is the GPU driver.
- mesa_glthread_app_profile=1: run OpenGL calls on a second thread (RetroArch: Zelda +24 %, Mario Kart 64 +23 %).
- mesa_extension_override: hide copy_image from PPSSPP so it copies framebuffers with blits on the GPU
  instead of CPU copies that wait for the GPU (most of the God of War gain).
-->
<driconf>
    <device>
        <application name="RetroArch" executable="retroarch">
            <option name="mesa_glthread_app_profile" value="1" />
        </application>
        <application name="PPSSPP" executable="PPSSPPSDL">
            <option name="mesa_glthread_app_profile" value="1" />
            <option name="mesa_extension_override" value="-GL_OES_copy_image -GL_EXT_copy_image" />
        </application>
        <application name="PPSSPP" executable="ppsspp">
            <option name="mesa_glthread_app_profile" value="1" />
            <option name="mesa_extension_override" value="-GL_OES_copy_image -GL_EXT_copy_image" />
        </application>
    </device>
</driconf>
