# use built-in dhcp client
[General]
# iwd adopta la interfaz que crea el driver (wlan0). Con el valor por defecto (false) iwd la borra y crea la suya;
# si el modulo se carga despues de iwd (o se recarga al despertar de la suspension) aparecen dos interfaces
# (wlan0 del driver y wlan1 de iwd) y ES/wifictl, que usan wlan0, no encuentran la estacion.
UseDefaultInterface=true
EnableNetworkConfiguration=true
ControlPortOverNL80211=false

[Network]
RoutePriorityOffset=200

NameResolvingService=systemd
EnableIPv6=true


[Scan]
MaximumPeriodicScanInterval=30
